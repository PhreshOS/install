name: Verify

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        strategy:
            matrix:
                os:
                    - macos-latest
                    - ubuntu-latest
                    - windows-latest

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - run: bun install --frozen-lockfile

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  package-manager-cache: false

            - run: bun run verify

    windows-install:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  package-manager-cache: false

            - run: bun install --frozen-lockfile
            - run: bun run test:platform
