name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        strategy:
            matrix:
                os:
                    - macos-latest
                    - ubuntu-latest
                    - windows-latest

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - run: bun install --frozen-lockfile

            - run: bun run typecheck

            - run: bun run test

            - run: bun run build

            - if: runner.os != 'Windows'
              run: bun run verify:sh

            - if: runner.os == 'Windows'
              run: bun run verify:ps1
